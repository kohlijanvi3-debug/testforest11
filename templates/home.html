<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forest Fire Weather Index Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card shadow-lg">
                <div class="card-body">

                    <h2 class="text-center mb-4">
                        Forest Fire Weather Index (FWI) Prediction
                    </h2>

                    <form action="{{ url_for('predict_datapoint') }}" method="POST">

                        <div class="mb-3">
                            <label class="form-label">Temperature</label>
                            <input type="text"
                                   class="form-control"
                                   name="Temperature"
                                   placeholder="Enter Temperature"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Relative Humidity (RH)</label>
                            <input type="text"
                                   class="form-control"
                                   name="RH"
                                   placeholder="Enter RH"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Wind Speed (WS)</label>
                            <input type="text"
                                   class="form-control"
                                   name="WS"
                                   placeholder="Enter Wind Speed"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Rain</label>
                            <input type="text"
                                   class="form-control"
                                   name="Rain"
                                   placeholder="Enter Rain"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">FFMC</label>
                            <input type="text"
                                   class="form-control"
                                   name="FFMC"
                                   placeholder="Enter FFMC"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">DMC</label>
                            <input type="text"
                                   class="form-control"
                                   name="DMC"
                                   placeholder="Enter DMC"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">ISI</label>
                            <input type="text"
                                   class="form-control"
                                   name="ISI"
                                   placeholder="Enter ISI"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Classes</label>
                            <input type="text"
                                   class="form-control"
                                   name="Classes"
                                   placeholder="Enter Classes (0 or 1)"
                                   required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Region</label>
                            <input type="text"
                                   class="form-control"
                                   name="Region"
                                   placeholder="Enter Region (0 or 1)"
                                   required>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Predict
                            </button>
                        </div>

                    </form>

                    <hr>

                    <div class="text-center">
                        <h3>
                            The FWI Prediction is:
                        </h3>

                        <h2 class="text-success">
                            {{ results }}
                        </h2>
                    </div>

                </div>
            </div>

        </div>
    </div>
</div>

</body>
</html>
